<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🌍 Global Chat</title>
<style>
  :root { 
    --bg: #0d0d0d; 
    --accent: #d4a373; 
    --input-bg: #1a1a1a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body, html { 
    margin: 0; padding: 0; width: 100%; height: 100%; 
    background: var(--bg); color: white; font-family: -apple-system, sans-serif; 
    overflow: hidden; /* Voorkomt dubbele scrollbars op mobiel */
  }

  #app { 
    display: flex; flex-direction: column; 
    height: 100vh; height: -webkit-fill-available; 
  }

  /* Header */
  header { 
    padding: env(safe-area-inset-top) 15px 10px 15px; 
    background: #111; border-bottom: 1px solid #222; 
    display: flex; justify-content: space-between; align-items: center;
    z-index: 10;
  }

  /* Chat venster */
  #chat-container { 
    flex: 1; overflow-y: auto; padding: 15px; 
    display: flex; flex-direction: column; gap: 12px;
    background: #080808;
    -webkit-overflow-scrolling: touch;
  }

  /* Chat Bubbels (Thema match) */
  .bubble { 
    background: #141414; padding: 12px 16px; border-radius: 18px; 
    border-top-left-radius: 2px; border: 1px solid #262626; 
    max-width: 85%; align-self: flex-start; word-wrap: break-word;
    position: relative;
  }
  .me { 
    align-self: flex-end; border-top-left-radius: 18px; 
    border-top-right-radius: 2px; background: #1e1e1e; 
    border-color: #333;
  }
  .name { 
    font-size: 0.75rem; color: var(--accent); 
    font-weight: bold; margin-bottom: 4px; display: block; 
  }

  /* Input balk onderaan (Fixed Mobile Fix) */
  .input-area { 
    padding: 10px 15px calc(10px + env(safe-area-inset-bottom)) 15px; 
    background: #0d0d0d; border-top: 1px solid #222; 
    display: flex; gap: 10px; align-items: center;
  }
  
  input#msg-input { 
    flex: 1; background: var(--input-bg); border: 1px solid #333; 
    border-radius: 25px; color: white; padding: 12px 18px; 
    font-size: 16px; /* 16px voorkomt auto-zoom op iOS */
    outline: none;
  }

  button#send-btn { 
    background: var(--accent); border: none; width: 45px; height: 45px; 
    border-radius: 50%; font-weight: bold; cursor: pointer; 
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }

  /* Login Scherm */
  #login-screen { 
    position: fixed; inset: 0; background: var(--bg); 
    display: flex; flex-direction: column; justify-content: center; 
    align-items: center; z-index: 1000; padding: 20px;
  }
  .login-box {
    width: 100%; max-width: 300px; text-align: center;
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1 style="color:var(--accent); margin-bottom: 25px;">🌍 Global Chat</h1>
    <input type="text" id="username-input" placeholder="Kies een naam..." maxlength="15">
    <button id="start-btn" style="width:100%; padding:15px; background:var(--accent); border:none; border-radius:25px; font-weight:bold; margin-top:10px; cursor:pointer;">Start Chat</button>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <b style="color:var(--accent)">GLOBAL CHAT</b>
    <span style="font-size: 0.9rem;">Online: <span id="user-count">0</span> 👤</span>
  </header>
  
  <div id="chat-container"></div>
  
  <div class="input-area">
    <input type="text" id="msg-input" placeholder="Typ een bericht..." autocomplete="off">
    <button id="send-btn">➔</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { 
    getFirestore, collection, addDoc, serverTimestamp, 
    query, orderBy, onSnapshot, limit, doc, setDoc 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgct_ZuSu3zy8q8i6fxXtIlRBSSKK7vng",
    authDomain: "world-chat-6dd70.firebaseapp.com",
    projectId: "world-chat-6dd70",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let user = localStorage.getItem("chat_user");

  // Login handler
  document.getElementById("start-btn").onclick = () => {
    const val = document.getElementById("username-input").value.trim();
    if(val.length < 2) return alert("Naam moet minimaal 2 tekens zijn.");
    user = val;
    localStorage.setItem("chat_user", val);
    location.reload(); 
  };

  if(user) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "flex";
    
    // Status: Online zetten
    setDoc(doc(db, "online", user), { name: user, lastSeen: serverTimestamp() });
    
    // Online teller
    onSnapshot(collection(db, "online"), s => {
      document.getElementById("user-count").innerText = s.size;
    });
    
    // Berichten ophalen (Gelimiteerd op 50 voor performance)
    const q = query(collection(db, "messages"), orderBy("time", "desc"), limit(50));
    onSnapshot(q, s => {
      const container = document.getElementById("chat-container");
      const docs = [...s.docs].reverse(); // Draai om zodat nieuwste onderaan staan
      
      container.innerHTML = docs.map(d => {
        const data = d.data();
        const isMe = data.name === user;
        return `
          <div class="bubble ${isMe ? 'me' : ''}">
            <span class="name">${data.name}</span>
            <div class="text">${data.text}</div>
          </div>
        `;
      }).join('');
      
      container.scrollTop = container.scrollHeight;
    });
  }

  // Bericht versturen
  async function send() {
    const inp = document.getElementById("msg-input");
    const txt = inp.value.trim();
    if(!txt) return;

    inp.value = ""; // Maak direct leeg voor snelle feedback
    
    try {
      await addDoc(collection(db, "messages"), {
        name: user,
        text: txt,
        time: serverTimestamp()
      });
    } catch(e) {
      console.error(e);
      alert("Fout bij verzenden. Probeer het opnieuw.");
    }
  }

  document.getElementById("send-btn").onclick = send;
  document.getElementById("msg-input").onkeypress = e => { if(e.key === "Enter") send(); };

  // Focus fix voor mobiel: scroll naar beneden als toetsenbord opent
  document.getElementById("msg-input").addEventListener('focus', () => {
    setTimeout(() => {
      const container = document.getElementById("chat-container");
      container.scrollTop = container.scrollHeight;
    }, 300);
  });
</script>
</body>
</html>
