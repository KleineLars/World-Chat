<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: #e5e5e5;
  font-family: Arial, sans-serif;
}

header {
  padding: 14px;
  background: #111;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#room {
  background: #1c1c1c;
  color: white;
  border: none;
  padding: 6px;
  border-radius: 6px;
}

#users {
  font-size: 0.9em;
  opacity: 0.8;
}

#chat {
  padding: 15px;
  height: calc(100vh - 160px);
  overflow-y: auto;
}

.msg {
  background: #1a1a1a;
  border-radius: 14px;
  padding: 10px;
  margin-bottom: 10px;
  max-width: 85%;
}

.name {
  font-size: 0.75em;
  opacity: 0.7;
}

.time {
  font-size: 0.65em;
  opacity: 0.5;
  margin-left: 6px;
}

.spin {
  animation: spin 2s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.reactions span {
  margin-right: 6px;
  cursor: pointer;
}

footer {
  padding: 10px;
  background: #111;
  display: flex;
  gap: 6px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  border: none;
  background: #1c1c1c;
  color: white;
}

button {
  background: #2563eb;
  border: none;
  border-radius: 12px;
  padding: 10px 14px;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <select id="room">
    <option value="global">Global</option>
    <option value="random">Random</option>
    <option value="gaming">Gaming</option>
  </select>
  <div id="users">Online: 0</div>
</header>

<div id="chat"></div>

<footer>
  <input id="text" placeholder="Type a message..." disabled>
  <button id="send" disabled>Send</button>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, serverTimestamp,
  query, orderBy, onSnapshot, deleteDoc, doc, setDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgct_ZuSu3zy8q8i6fxXtIlRBSSKK7vng",
  authDomain: "world-chat-6dd70.firebaseapp.com",
  projectId: "world-chat-6dd70",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const chat = document.getElementById("chat");
const input = document.getElementById("text");
const send = document.getElementById("send");
const users = document.getElementById("users");
const roomSel = document.getElementById("room");

let name = localStorage.getItem("name");
let color = localStorage.getItem("color") || "#" + Math.floor(Math.random()*16777215).toString(16);
localStorage.setItem("color", color);

while (!name) {
  name = prompt("Enter your name:");
  if (name) localStorage.setItem("name", name);
}

input.disabled = false;
send.disabled = false;

await setDoc(doc(db, "online", name), { time: serverTimestamp() });

window.addEventListener("beforeunload", async () => {
  await deleteDoc(doc(db, "online", name));
});

onSnapshot(collection(db, "online"), s => {
  users.innerText = "Online: " + s.size;
});

let lastSend = 0;
let room = "global";

function loadChat() {
  chat.innerHTML = "";
  const q = query(collection(db, "messages", room, "chat"), orderBy("time"));
  onSnapshot(q, snap => {
    chat.innerHTML = "";
    snap.forEach(async d => {
      const m = d.data();
      if (m.time && Date.now() - m.time.toMillis() > 3600000) {
        await deleteDoc(doc(db, "messages", room, "chat", d.id));
        return;
      }
      const div = document.createElement("div");
      div.className = "msg";
      if (m.spin) div.classList.add("spin");
      div.innerHTML = `
        <div class="name" style="color:${m.color}">
          ${m.name}<span class="time">${new Date(m.time.toMillis()).toLocaleTimeString()}</span>
        </div>
        ${m.text}
        <div class="reactions">👍 ❤️ 😂 🔥</div>
      `;
      chat.appendChild(div);
    });
    chat.scrollTop = chat.scrollHeight;
  });
}

loadChat();

roomSel.onchange = () => {
  room = roomSel.value;
  loadChat();
};

send.onclick = async () => {
  const text = input.value.trim();
  if (!text || Date.now() - lastSend < 10000) return;

  lastSend = Date.now();
  input.value = "";

  let spin = false;
  let msg = text;

  if (text.startsWith("/spin ")) {
    spin = true;
    msg = text.replace("/spin ", "");
  }

  await addDoc(collection(db, "messages", room, "chat"), {
    name,
    text: msg,
    color,
    spin,
    time: serverTimestamp()
  });
};
</script>

</body>
</html>
