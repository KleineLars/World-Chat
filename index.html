<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🌍 World Chat</title>
<style>
  :root { 
    --bg: #0d0d0d; 
    --accent: #d4a373; 
    --card-bg: #161616;
    --input-focus: #1c1c1c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body, html { 
    margin: 0; padding: 0; width: 100%; height: 100%; 
    background: var(--bg); color: white; font-family: -apple-system, system-ui, sans-serif; 
    overflow: hidden; position: fixed; 
  }

  /* --- LOGIN SCHERM (STYLISH) --- */
  #login-screen { 
    position: fixed; inset: 0; background: var(--bg); 
    display: flex; flex-direction: column; justify-content: center; 
    align-items: center; z-index: 1000; padding: 25px;
  }

  .login-card { 
    width: 100%; max-width: 340px; text-align: center; 
    background: var(--card-bg); padding: 40px 30px; 
    border-radius: 28px; border: 1px solid #222;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }

  .login-card h1 { 
    margin: 0 0 30px 0; font-size: 2rem; color: var(--accent);
    letter-spacing: -1px;
  }

  input#username-input { 
    width: 100%; background: #000; border: 1px solid #333; 
    border-radius: 16px; color: white; padding: 18px; 
    font-size: 16px; outline: none; margin-bottom: 20px;
    transition: all 0.3s ease;
    text-align: center;
  }

  input#username-input:focus { 
    border-color: var(--accent); background: var(--input-focus);
  }

  #start-btn { 
    width: 100%; padding: 18px; background: var(--accent); 
    border: none; border-radius: 16px; font-weight: bold; 
    font-size: 1rem; cursor: pointer; color: #000;
    transition: transform 0.2s active;
  }

  #start-btn:active { transform: scale(0.96); }

  /* --- CHAT INTERFACE --- */
  #app { display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; }

  header { 
    padding: env(safe-area-inset-top) 20px 15px 20px; 
    background: rgba(17, 17, 17, 0.8); backdrop-filter: blur(10px);
    border-bottom: 1px solid #222; display: flex; 
    justify-content: space-between; align-items: center; z-index: 10;
  }

  #chat-container { 
    flex: 1; overflow-y: auto; padding: 15px; 
    display: flex; flex-direction: column; gap: 12px;
    background: #080808; -webkit-overflow-scrolling: touch;
  }

  .bubble { 
    background: #161616; padding: 12px 16px; border-radius: 18px; 
    border-top-left-radius: 4px; border: 1px solid #222; 
    max-width: 85%; align-self: flex-start; word-wrap: break-word;
  }
  .me { align-self: flex-end; border-top-left-radius: 18px; border-top-right-radius: 4px; background: #222; border-color: #333; }
  .name { font-size: 0.75rem; color: var(--accent); font-weight: bold; margin-bottom: 4px; display: block; }

  .input-area { 
    padding: 12px 15px calc(12px + env(safe-area-inset-bottom)) 15px; 
    background: #0d0d0d; border-top: 1px solid #222; 
    display: flex; gap: 12px; align-items: center;
  }
  
  input#msg-input { 
    flex: 1; background: #161616; border: 1px solid #333; 
    border-radius: 20px; color: white; padding: 14px 20px; 
    font-size: 16px; outline: none; 
  }

  button#send-btn { 
    background: var(--accent); border: none; width: 48px; height: 48px; 
    border-radius: 50%; font-weight: bold; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>🌍 World Chat</h1>
    <input type="text" id="username-input" placeholder="Username" maxlength="15" autocomplete="off">
    <button id="start-btn">Chat Starten</button>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <b style="color:var(--accent); font-size: 1.1rem;">WORLD CHAT</b>
    <span style="font-size: 0.9rem; opacity: 0.8;"><span id="user-count">0</span> online</span>
  </header>
  <div id="chat-container"></div>
  <div class="input-area">
    <input type="text" id="msg-input" placeholder="Typ een bericht..." autocomplete="off">
    <button id="send-btn">➔</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, limit, doc, setDoc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgct_ZuSu3zy8q8i6fxXtIlRBSSKK7vng",
    authDomain: "world-chat-6dd70.firebaseapp.com",
    projectId: "world-chat-6dd70",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let user = localStorage.getItem("chat_user");

  document.getElementById("start-btn").onclick = () => {
    const val = document.getElementById("username-input").value.trim();
    if(val.length < 2) return alert("Je naam is te kort!");
    user = val;
    localStorage.setItem("chat_user", val);
    location.reload(); 
  };

  if(user) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "flex";
    
    setDoc(doc(db, "online", user), { name: user });
    onSnapshot(collection(db, "online"), s => document.getElementById("user-count").innerText = s.size);
    
    const startListening = () => {
      const tenMinutesAgo = new Date(Date.now() - 10 * 60 * 1000);
      const q = query(
        collection(db, "messages"), 
        where("time", ">=", tenMinutesAgo),
        orderBy("time", "desc"), 
        limit(50)
      );

      onSnapshot(q, s => {
        const container = document.getElementById("chat-container");
        const docs = [...s.docs].reverse();
        container.innerHTML = docs.map(d => {
          const data = d.data();
          const isMe = data.name === user;
          return `<div class="bubble ${isMe ? 'me' : ''}"><span class="name">${data.name}</span>${data.text}</div>`;
        }).join('');
        container.scrollTop = container.scrollHeight;
      }, (e) => console.log("Wacht op index..."));
    };

    startListening();
    setInterval(startListening, 30000); // Ververs elke 30 sec voor de 10-minuten grens
  }

  async function send() {
    const inp = document.getElementById("msg-input");
    const txt = inp.value.trim();
    if(!txt) return;
    inp.value = "";
    try {
      await addDoc(collection(db, "messages"), { 
        name: user, 
        text: txt, 
        time: serverTimestamp() 
      });
    } catch(e) { console.error(e); }
  }

  document.getElementById("send-btn").onclick = send;
  document.getElementById("msg-input").onkeypress = e => { if(e.key === "Enter") send(); };
</script>
</body>
</html>
