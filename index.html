<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Global Chat</title>

<style>
  :root {
    --bg-color: #0d0d0d;
    --card-bg: #1a1a1a;
    --accent-color: #d4a373; /* De goud/beige kleur uit de screenshot */
    --text-main: #ffffff;
    --text-dim: #a0a0a0;
    --bubble-bg: #141414;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* --- Home / Login Pagina --- */
  #login-screen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 20px;
    text-align: center;
  }

  .logo-icon {
    font-size: 3rem;
    margin-bottom: 10px;
  }

  #login-screen h1 {
    color: var(--accent-color);
    margin-bottom: 30px;
  }

  .input-group {
    width: 100%;
    max-width: 300px;
  }

  input#name-input {
    width: 100%;
    padding: 15px;
    background: var(--card-bg);
    border: 1px solid #333;
    border-radius: 12px;
    color: white;
    font-size: 1rem;
    box-sizing: border-box;
    margin-bottom: 15px;
  }

  .btn-primary {
    width: 100%;
    padding: 15px;
    background: var(--accent-color);
    color: #000;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
  }

  /* --- Chat Interface --- */
  #chat-screen {
    display: none; /* Verbergen tot login */
    flex-direction: column;
    height: 100%;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 20px;
    border-bottom: 1px solid #222;
  }

  header h2 {
    margin: 0;
    font-size: 1.4rem;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .online-count {
    color: var(--accent-color);
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Chat Bubbels Style */
  .message-wrapper {
    max-width: 85%;
    align-self: flex-start;
  }

  .msg-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
    padding: 0 5px;
  }

  .username {
    font-weight: bold;
    font-size: 0.9rem;
  }

  .timestamp {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-left: 10px;
  }

  .bubble {
    background: var(--bubble-bg);
    padding: 12px 16px;
    border-radius: 15px;
    border-top-left-radius: 2px;
    line-height: 1.4;
    border: 1px solid #222;
    word-wrap: break-word;
  }

  /* Jouw eigen berichten */
  .me {
    align-self: flex-end;
  }
  .me .bubble {
    background: #1e1e1e;
    border-top-left-radius: 15px;
    border-top-right-radius: 2px;
  }

  /* Input Area */
  .input-area {
    padding: 15px;
    background: var(--bg-color);
    display: flex;
    gap: 10px;
    border-top: 1px solid #222;
  }

  #msg-input {
    flex: 1;
    background: var(--card-bg);
    border: none;
    padding: 12px 15px;
    border-radius: 25px;
    color: white;
    outline: none;
  }

  #send-btn {
    background: var(--accent-color);
    border: none;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }

  #send-btn:disabled {
    opacity: 0.5;
  }
</style>
</head>
<body>

  <div id="login-screen">
    <div class="logo-icon">🌍</div>
    <h1>Global Chat</h1>
    <div class="input-group">
      <input type="text" id="name-input" placeholder="Kies een naam..." maxlength="15">
      <button id="login-btn" class="btn-primary">Start Chatten</button>
    </div>
  </div>

  <div id="chat-screen">
    <header>
      <h2><span>←</span> Global Chat</h2>
      <div class="online-count">
        <span id="users-num">0</span> 👤
      </div>
    </header>

    <div id="chat-container">
      </div>

    <div id="cooldown" style="text-align: center; font-size: 0.8rem; color: var(--accent-color);"></div>

    <div class="input-area">
      <input type="text" id="msg-input" placeholder="Typ een bericht...">
      <button id="send-btn">➔</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore, collection, addDoc, serverTimestamp,
    query, orderBy, onSnapshot, deleteDoc, doc, setDoc, limit
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgct_ZuSu3zy8q8i6fxXtIlRBSSKK7vng",
    authDomain: "world-chat-6dd70.firebaseapp.com",
    projectId: "world-chat-6dd70",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let username = localStorage.getItem("chat_username");
  const loginScreen = document.getElementById("login-screen");
  const chatScreen = document.getElementById("chat-screen");
  const chatContainer = document.getElementById("chat-container");
  const msgInput = document.getElementById("msg-input");
  const sendBtn = document.getElementById("send-btn");
  const usersNum = document.getElementById("users-num");

  // Login Logica
  document.getElementById("login-btn").onclick = () => {
    const val = document.getElementById("name-input").value.trim();
    if(val.length < 2) return alert("Naam te kort!");
    username = val;
    localStorage.setItem("chat_username", val);
    showChat();
  };

  function showChat() {
    loginScreen.style.display = "none";
    chatScreen.style.display = "flex";
    initPresence();
  }

  // Als we al een naam hebben, direct naar chat
  if(username) {
    document.getElementById("name-input").value = username;
  }

  // Aanwezigheid (Simpel)
  async function initPresence() {
    await setDoc(doc(db, "online", username), { name: username, lastSeen: serverTimestamp() });
  }

  onSnapshot(query(collection(db, "online")), snap => {
    usersNum.innerText = snap.size;
  });

  // Berichten ophalen
  const q = query(collection(db, "messages"), orderBy("time", "asc"), limit(50));
  onSnapshot(q, snap => {
    chatContainer.innerHTML = "";
    snap.forEach(d => {
      const data = d.data();
      const isMe = data.name === username;
      const timeStr = data.time ? new Date(data.time.toMillis()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "...";

      const msgHtml = `
        <div class="message-wrapper ${isMe ? 'me' : ''}">
          <div class="msg-header">
            <span class="username">${data.name}</span>
            <span class="timestamp">${timeStr}</span>
          </div>
          <div class="bubble">${data.text}</div>
        </div>
      `;
      chatContainer.innerHTML += msgHtml;
    });
    chatContainer.scrollTop = chatContainer.scrollHeight;
  });

  // Berichten versturen
  sendBtn.onclick = async () => {
    const text = msgInput.value.trim();
    if(!text) return;

    msgInput.value = "";
    await addDoc(collection(db, "messages"), {
      name: username,
      text: text,
      time: serverTimestamp()
    });
  };

  // Enter toets ondersteuning
  msgInput.onkeypress = (e) => { if(e.key === "Enter") sendBtn.click(); };

</script>
</body>
</html>
