<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🌍 Fun World Chat</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  display: flex;
  justify-content: center;
}
#app {
  width: 100%;
  max-width: 600px;
  padding: 20px;
}
h1 {
  text-align: center;
}
#homeScreen, #chatScreen {
  display: none;
}
#chat {
  height: 350px;
  overflow-y: auto;
  background: #020617;
  border-radius: 8px;
  padding: 10px;
}
.message {
  margin-bottom: 6px;
  transition: transform 0.3s ease;
}
.spin {
  animation: spin 1s linear 3;
}
@keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}
.system { color: #38bdf8; font-size: 0.9em; }
input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 6px;
  border: none;
}
button { background: #38bdf8; font-weight: bold; cursor: pointer; }
button:disabled { background: #334155; }
#top { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9em; color: #94a3b8; }
.reactions span { cursor:pointer; margin-right:5px; }
</style>
</head>
<body>
<div id="app">
  <!-- HOME SCREEN -->
  <div id="homeScreen">
    <h1>🌍 Fun World Chat</h1>
    <input id="nameInput" placeholder="Enter username">
    <button id="startBtn">Start Chat</button>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chatScreen">
    <div id="top">
      <div id="users">Online: 0</div>
      <div id="cooldown"></div>
    </div>
    <div id="chat"></div>
    <input id="msg" placeholder="Type a message...">
    <button id="send">Send</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, serverTimestamp,
  query, orderBy, onSnapshot, doc, setDoc, deleteDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgct_ZuSu3zy8q8i6fxXtIlRBSSKK7vng",
  authDomain: "world-chat-6dd70.firebaseapp.com",
  projectId: "world-chat-6dd70",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Elements
const home = document.getElementById("homeScreen");
const chatScreen = document.getElementById("chatScreen");
const nameInput = document.getElementById("nameInput");
const startBtn = document.getElementById("startBtn");
const chatDiv = document.getElementById("chat");
const msgInput = document.getElementById("msg");
const sendBtn = document.getElementById("send");
const cooldownDiv = document.getElementById("cooldown");
const usersDiv = document.getElementById("users");

let username = null;
let userColor = null;
let lastSend = 0;
const COOLDOWN = 10;
const BAD_WORDS = ["fuck","shit","bitch","nigger","kanker","hoer"];
const REACTIONS = ["👍","❤️","😂","😮","😢","😡"];

// FUNCTIONS
function randomColor(){ return '#'+Math.floor(Math.random()*16777215).toString(16); }
function showHome(){ home.style.display="block"; chatScreen.style.display="none"; }
function showChat(){ home.style.display="none"; chatScreen.style.display="block"; }

// LOGIN
showHome();
startBtn.onclick = async () => {
  const name = nameInput.value.trim();
  if(!name) return alert("Enter a username");
  username = name;
  userColor = randomColor();
  showChat();
  // Add to online
  await setDoc(doc(db,"online",username), {name:username,time:serverTimestamp(),color:userColor});
}

// REMOVE ONLINE ON LEAVE
window.addEventListener("beforeunload",async()=>{ if(username) await deleteDoc(doc(db,"online",username)); });

// ONLINE USERS
onSnapshot(query(collection(db,"online")), snap=>{
  usersDiv.innerText=`Online: ${snap.size}`;
});

// CHAT MESSAGES
onSnapshot(query(collection(db,"messages"),orderBy("time")), async snap=>{
  chatDiv.innerHTML="";
  const now = Date.now();
  for(const d of snap.docs){
    const data = d.data();
    const msgDiv = document.createElement("div");
    msgDiv.classList.add("message");
    msgDiv.style.color=data.color||"#fff";

    let txt = data.text;
    // /spin
    if(txt.startsWith("/spin ")){ txt=txt.replace("/spin ",""); msgDiv.classList.add("spin"); }

    msgDiv.innerHTML=`<b>${data.name}:</b> ${txt} <div class="reactions">${REACTIONS.map(r=>`<span onclick="react('${d.id}','${r}')">${r} ${data.reactions?.[r]||0}</span>`).join('')}</div>`;
    chatDiv.appendChild(msgDiv);

    // Auto delete after 1h
    if(data.time && now - data.time.toMillis() > 1000*60*60) await deleteDoc(doc(db,"messages",d.id));
  }
  chatDiv.scrollTop=chatDiv.scrollHeight;
});

// SEND MESSAGE
sendBtn.onclick=async()=>{
  let text = msgInput.value.trim();
  if(!text) return;
  for(let w of BAD_WORDS) if(text.toLowerCase().includes(w)) return alert("Message blocked (bad language)");
  const now = Date.now();
  if(now-lastSend<COOLDOWN*1000) return;

  lastSend = now;
  msgInput.value="";
  await addDoc(collection(db,"messages"),{name:username,text,time:serverTimestamp(),color:userColor,reactions:{}});
  let t=COOLDOWN;
  sendBtn.disabled=true;
  cooldownDiv.innerText=`Cooldown: ${t}s`;
  const timer=setInterval(()=>{
    t--;
    cooldownDiv.innerText=t>0?`Cooldown: ${t}s`:"";
    if(t<=0){ clearInterval(timer); sendBtn.disabled=false;}
  },1000);
}

// REACTIONS FUNCTION
window.react=async(id,r)=>{
  const docRef=doc(db,"messages",id);
  const snap=await docRef.get();
  const data=snap.data();
  const reactions = data.reactions||{};
  reactions[r]=reactions[r]?reactions[r]+1:1;
  await updateDoc(docRef,{reactions});
}
</script>
</body>
</html>
