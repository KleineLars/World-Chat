<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🌍 World Chat 10m</title>
<style>
  :root { --bg: #0d0d0d; --accent: #d4a373; --bubble: #1a1a1a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body, html { 
    margin: 0; padding: 0; width: 100%; height: 100%; 
    background: var(--bg); color: white; font-family: -apple-system, sans-serif; 
    overflow: hidden; position: fixed; 
  }

  #app { display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; }

  header { 
    padding: env(safe-area-inset-top) 15px 10px 15px; 
    background: #111; border-bottom: 1px solid #222; 
    display: flex; justify-content: space-between; align-items: center;
    z-index: 10;
  }

  #chat-container { 
    flex: 1; overflow-y: auto; padding: 15px; 
    display: flex; flex-direction: column; gap: 12px;
    padding-bottom: 20px;
    background: #080808;
    -webkit-overflow-scrolling: touch;
  }

  .bubble { 
    background: var(--bubble); padding: 12px 16px; border-radius: 18px; 
    border-top-left-radius: 2px; border: 1px solid #333; 
    max-width: 85%; align-self: flex-start; word-wrap: break-word;
  }
  .me { align-self: flex-end; border-top-left-radius: 18px; border-top-right-radius: 2px; background: #262626; border-color: #444; }
  .name { font-size: 0.75rem; color: var(--accent); font-weight: bold; margin-bottom: 4px; display: block; }

  .input-area { 
    padding: 10px 15px calc(10px + env(safe-area-inset-bottom)) 15px; 
    background: #0d0d0d; border-top: 1px solid #222; 
    display: flex; gap: 10px; align-items: center;
  }
  
  input#msg-input { 
    flex: 1; background: #000; border: 1px solid #444; 
    border-radius: 25px; color: white; padding: 12px 18px; 
    font-size: 16px; outline: none; 
  }

  button#send-btn { 
    background: var(--accent); border: none; width: 45px; height: 45px; 
    border-radius: 50%; font-weight: bold; cursor: pointer; flex-shrink: 0;
  }

  #login-screen { 
    position: fixed; inset: 0; background: var(--bg); 
    display: flex; flex-direction: column; justify-content: center; 
    align-items: center; z-index: 1000; padding: 20px;
  }
  .login-card { width: 100%; max-width: 320px; text-align: center; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1 style="color:var(--accent)">🌍 World Chat</h1>
    <p style="color: #666; font-size: 0.9rem;">Berichten resetten elke 10 min.</p>
    <input type="text" id="username-input" placeholder="Je naam..." maxlength="15">
    <button id="start-btn" style="width:100%; padding:15px; background:var(--accent); border:none; border-radius:25px; font-weight:bold; cursor:pointer;">Chat Starten</button>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <b style="color:var(--accent)">GLOBAL CHAT</b>
    <span>Online: <span id="user-count">0</span> 👤</span>
  </header>
  <div id="chat-container"></div>
  <div class="input-area">
    <input type="text" id="msg-input" placeholder="Typ een bericht..." autocomplete="off">
    <button id="send-btn">➔</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, limit, doc, setDoc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgct_ZuSu3zy8q8i6fxXtIlRBSSKK7vng",
    authDomain: "world-chat-6dd70.firebaseapp.com",
    projectId: "world-chat-6dd70",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let user = localStorage.getItem("chat_user");

  document.getElementById("start-btn").onclick = () => {
    const val = document.getElementById("username-input").value.trim();
    if(val.length < 2) return alert("Kies een langere naam.");
    user = val;
    localStorage.setItem("chat_user", val);
    location.reload(); 
  };

  if(user) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "flex";
    
    // Zet online status
    setDoc(doc(db, "online", user), { name: user });
    onSnapshot(collection(db, "online"), s => document.getElementById("user-count").innerText = s.size);
    
    // Real-time Chat Laden met 10 minuten filter
    const startListening = () => {
      // Alleen berichten van de laatste 10 minuten tonen
      const tenMinutesAgo = new Date(Date.now() - 10 * 60 * 1000);
      
      const q = query(
        collection(db, "messages"), 
        where("time", ">=", tenMinutesAgo),
        orderBy("time", "desc"), 
        limit(50)
      );

      onSnapshot(q, s => {
        const container = document.getElementById("chat-container");
        const docs = [...s.docs].reverse();
        container.innerHTML = docs.map(d => {
          const data = d.data();
          return `<div class="bubble ${data.name === user ? 'me' : ''}"><span class="name">${data.name}</span>${data.text}</div>`;
        }).join('');
        container.scrollTop = container.scrollHeight;
      }, (error) => {
        // Als de query faalt door ontbrekende Index in Firebase (zie console log voor link)
        console.error("Query fout: ", error);
      });
    };

    startListening();
    // Herlaad de query elke minuut om de 10-minuten-venster te updaten
    setInterval(startListening, 60000);
  }

  async function send() {
    const inp = document.getElementById("msg-input");
    const txt = inp.value.trim();
    if(!txt) return;
    inp.value = "";
    try {
      await addDoc(collection(db, "messages"), { 
        name: user, 
        text: txt, 
        time: serverTimestamp() 
      });
    } catch(e) { console.error("Fout bij verzenden: ", e); }
  }

  document.getElementById("send-btn").onclick = send;
  document.getElementById("msg-input").onkeypress = e => { if(e.key === "Enter") send(); };
</script>
</body>
</html>
