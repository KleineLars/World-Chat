<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🌍 World Chat</title>
<style>
  :root { 
    --bg: #0d0d0d; 
    --logo-green: #4ade80; 
    --logo-blue: #3b82f6;
    --accent-gradient: linear-gradient(135deg, #4ade80 0%, #3b82f6 100%);
    --card-bg: #161616;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body, html { 
    margin: 0; padding: 0; width: 100%; height: 100%; 
    background: var(--bg); color: white; 
    font-family: -apple-system, system-ui, sans-serif; 
    overflow: hidden; position: fixed; 
  }

  /* Auth Screens */
  .auth-screen { 
    position: fixed; inset: 0; background: var(--bg); 
    display: flex; flex-direction: column; justify-content: center; 
    align-items: center; z-index: 1000; padding: 25px; 
  }
  
  .auth-card { 
    width: 100%; max-width: 340px; text-align: center; 
    background: var(--card-bg); padding: 40px 30px; 
    border-radius: 28px; border: 1px solid #222; 
    box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
  }
  
  .logo-img { 
    width: 80px; height: 80px; margin-bottom: 20px; 
    filter: drop-shadow(0 0 10px rgba(74, 222, 128, 0.3)); 
  }
  
  h1 { 
    margin: 0 0 20px 0; font-size: 1.8rem; 
    background: var(--accent-gradient); 
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
    font-weight: 800; 
  }
  
  input { 
    width: 100%; background: #000; border: 1px solid #333; 
    border-radius: 16px; color: white; padding: 18px; 
    font-size: 16px; outline: none; margin-bottom: 20px; text-align: center; 
  }

  .btn { 
    width: 100%; padding: 18px; border: none; border-radius: 16px; 
    font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; 
  }
  
  .btn-google { 
    background: white; color: black; margin-bottom: 15px; 
    display: flex; align-items: center; justify-content: center; gap: 10px; 
  }
  
  .btn-primary { background: var(--accent-gradient); color: #000; }
  .btn:active { transform: scale(0.96); }

  /* Chat Interface */
  #app { display: none; flex-direction: column; height: 100vh; height: -webkit-fill-available; }
  
  header { 
    padding: env(safe-area-inset-top) 20px 15px 20px; 
    background: rgba(17, 17, 17, 0.8); backdrop-filter: blur(10px); 
    border-bottom: 1px solid #222; display: flex; 
    justify-content: space-between; align-items: center; 
  }
  
  #chat-container { 
    flex: 1; overflow-y: auto; padding: 15px; 
    display: flex; flex-direction: column; gap: 12px; 
    background: #080808; 
  }
  
  .bubble { 
    background: #161616; padding: 12px 16px; border-radius: 18px; 
    border-top-left-radius: 4px; border: 1px solid #222; 
    max-width: 85%; align-self: flex-start; word-wrap: break-word;
  }
  
  .me { 
    align-self: flex-end; border-top-left-radius: 18px; 
    border-top-right-radius: 4px; background: #222; border-color: #333; 
  }
  
  .name { 
    font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; display: block; 
    background: var(--accent-gradient); -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent; 
  }
  
  .input-area-container { 
    background: #0d0d0d; border-top: 1px solid #222; 
    padding-bottom: env(safe-area-inset-bottom); 
  }
  
  .input-area { padding: 12px 15px; display: flex; gap: 12px; align-items: center; }
  
  #msg-input { 
    flex: 1; background: #161616; border-radius: 20px; 
    padding: 14px 20px; border: 1px solid #333; color: white; outline: none; 
  }
  
  #send-btn { 
    background: var(--accent-gradient); width: 48px; height: 48px; 
    border-radius: 50%; border: none; font-size: 1.2rem; 
    cursor: pointer; display: flex; align-items: center; justify-content: center; 
  }
  
  .footer-copy { 
    margin-top: 25px; font-size: 0.75rem; color: #555; 
    font-weight: 500; letter-spacing: 0.5px; 
  }
</style>
</head>
<body>

<div id="login-screen" class="auth-screen">
  <div class="auth-card">
    <img src="1000015853.png" class="logo-img" alt="Logo">
    <h1>WORLD CHAT</h1>
    <button id="google-btn" class="btn btn-google">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Sign in with Google
    </button>
    <div class="footer-copy">© Kleine_Lars 2026</div>
  </div>
</div>

<div id="username-screen" class="auth-screen" style="display:none">
  <div class="auth-card">
    <h1>Choose Name</h1>
    <p style="color: #888; margin-bottom: 20px;">This name is permanent and unique.</p>
    <input type="text" id="username-input" placeholder="Enter username..." maxlength="15" autocomplete="off">
    <button id="save-username-btn" class="btn btn-primary">Claim Username</button>
    <div class="footer-copy">© Kleine_Lars 2026</div>
  </div>
</div>

<div id="app">
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
        <img src="1000015853.png" width="30" alt="Logo">
        <b style="background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800;">WORLD CHAT</b>
    </div>
    <span style="font-size: 0.9rem; opacity: 0.8;"><span id="user-count">0</span> online</span>
  </header>
  
  <div id="chat-container"></div>
  
  <div class="input-area-container">
    <div class="input-area">
      <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
      <button id="send-btn">➔</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, limit, doc, getDoc, setDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgct_ZuSu3zy8q8i6fxXtIlRBSSKK7vng",
    authDomain: "world-chat-6dd70.firebaseapp.com",
    projectId: "world-chat-6dd70",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  let currentUsername = null;

  // Verwerk de login redirect direct bij het laden van de pagina
  getRedirectResult(auth).catch((error) => console.error("Login redirect error:", error.message));

  document.getElementById("google-btn").onclick = () => signInWithRedirect(auth, provider);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const userDoc = await getDoc(doc(db, "users", user.uid));
      
      if (userDoc.exists()) {
        currentUsername = userDoc.data().username;
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("username-screen").style.display = "none";
        startChat();
      } else {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("username-screen").style.display = "flex";
      }
    } else {
      document.getElementById("login-screen").style.display = "flex";
      document.getElementById("app").style.display = "none";
    }
  });

  document.getElementById("save-username-btn").onclick = async () => {
    const input = document.getElementById("username-input").value.trim().toLowerCase();
    if (input.length < 3) return alert("Min. 3 characters!");
    try {
      await runTransaction(db, async (t) => {
        const nameRef = doc(db, "usernames", input);
        if ((await t.get(nameRef)).exists()) throw "Name already taken!";
        t.set(nameRef, { uid: currentUser.uid });
        t.set(doc(db, "users", currentUser.uid), { username: input });
      });
      currentUsername = input;
      document.getElementById("username-screen").style.display = "none";
      startChat();
    } catch (e) { alert(e); }
  };

  function startChat() {
    document.getElementById("app").style.display = "flex";
    setDoc(doc(db, "online", currentUser.uid), { name: currentUsername, lastSeen: serverTimestamp() });
    onSnapshot(collection(db, "online"), s => document.getElementById("user-count").innerText = s.size);
    
    const q = query(collection(db, "messages"), orderBy("time", "desc"), limit(50));
    onSnapshot(q, s => {
      const container = document.getElementById("chat-container");
      container.innerHTML = [...s.docs].reverse().map(d => {
        const data = d.data();
        return `<div class="bubble ${data.uid === currentUser.uid ? 'me' : ''}"><span class="name">${data.name}</span>${data.text}</div>`;
      }).join('');
      container.scrollTop = container.scrollHeight;
    });
  }

  async function send() {
    const inp = document.getElementById("msg-input");
    const txt = inp.value.trim();
    if(!txt || !currentUser) return;
    inp.value = "";
    await addDoc(collection(db, "messages"), { uid: currentUser.uid, name: currentUsername, text: txt, time: serverTimestamp() });
  }

  document.getElementById("send-btn").onclick = send;
  document.getElementById("msg-input").onkeypress = e => { if(e.key === "Enter") send(); };
</script>
</body>
</html>
