<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🌍 World Chat</title>
<style>
  :root { 
    --bg: #0d0d0d; 
    --logo-green: #4ade80; 
    --logo-blue: #3b82f6;
    --accent-gradient: linear-gradient(135deg, #4ade80 0%, #3b82f6 100%);
    --card-bg: #161616;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body, html { margin: 0; padding: 0; width: 100%; height: 100dvh; background: var(--bg); color: white; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; position: fixed; }

  .auth-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; padding: 25px; }
  .auth-card { width: 100%; max-width: 340px; text-align: center; background: var(--card-bg); padding: 40px 30px; border-radius: 28px; border: 1px solid #222; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
  .logo-img { width: 80px; height: 80px; margin-bottom: 20px; filter: drop-shadow(0 0 10px rgba(74, 222, 128, 0.3)); }
  h1 { margin: 0 0 20px 0; font-size: 1.8rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
  
  input { width: 100%; background: #000; border: 1px solid #333; border-radius: 16px; color: white; padding: 18px; font-size: 16px; outline: none; margin-bottom: 20px; text-align: center; transition: 0.3s; }
  input:focus { border-color: var(--logo-green); }

  .btn { width: 100%; padding: 18px; border: none; border-radius: 16px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
  .btn-google { background: white; color: black; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn-primary { background: var(--accent-gradient); color: #000; }
  .btn-logout { background: transparent; color: #ff4444; border: 1px solid #ff4444; padding: 8px 15px; border-radius: 12px; font-size: 0.8rem; width: auto; }
  .btn:active { transform: scale(0.96); }

  #app { display: flex; flex-direction: column; height: 100vh; }
  header { padding: env(safe-area-inset-top) 20px 15px 20px; background: rgba(17, 17, 17, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
  #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #080808; }
  .bubble { background: #161616; padding: 12px 16px; border-radius: 18px; border-top-left-radius: 4px; border: 1px solid #222; max-width: 85%; align-self: flex-start; word-wrap: break-word; }
  .me { align-self: flex-end; border-top-left-radius: 18px; border-top-right-radius: 4px; background: #222; }
  .name { font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; display: block; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .input-area { padding: 12px 15px calc(12px + env(safe-area-inset-bottom)) 15px; background: #0d0d0d; border-top: 1px solid #222; display: flex; gap: 12px; }
  #msg-input { flex: 1; background: #161616; border-radius: 20px; padding: 14px 20px; border: 1px solid #333; margin: 0; text-align: left; }
  #send-btn { background: var(--accent-gradient); width: 48px; height: 48px; border-radius: 50%; border: none; font-size: 1.2rem; cursor: pointer; flex-shrink: 0; }
</style>
</head>
<body>

<div id="login-screen" class="auth-screen">
  <div class="auth-card">
    <img src="1000015853.png" class="logo-img" alt="Logo">
    <h1>WORLD CHAT</h1>
    <button id="google-btn" class="btn btn-google">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="G"> Sign in with Google
    </button>
  </div>
</div>

<div id="username-screen" class="auth-screen" style="display:none">
  <div class="auth-card">
    <h1>Choose Name</h1>
    <p style="color: #888; margin-bottom: 20px;">This name is permanent and unique.</p>
    <input type="text" id="username-input" placeholder="Username..." maxlength="15">
    <button id="save-username-btn" class="btn btn-primary">Claim Username</button>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
        <img src="1000015853.png" width="30" alt="Logo">
        <b style="background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">WORLD CHAT</b>
    </div>
    <button id="logout-btn" class="btn btn-logout">Logout</button>
  </header>
  <div id="chat-container"></div>
  <div class="input-area">
    <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
    <button id="send-btn">➔</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, limit, doc, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgct_ZuSu3zy8q8i6fxXtIlRBSSKK7vng",
    authDomain: "world-chat-6dd70.firebaseapp.com",
    projectId: "world-chat-6dd70",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  let currentUsername = null;
  let unsubscribeChat = null;

  // --- AUTH LOGIC ---
  document.getElementById("google-btn").onclick = () => signInWithPopup(auth, provider);

  document.getElementById("logout-btn").onclick = () => {
    if(confirm("Are you sure you want to log out?")) {
      signOut(auth).then(() => location.reload());
    }
  };

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      document.getElementById("login-screen").style.display = "none";
      
      const userDoc = await getDoc(doc(db, "users", user.uid));
      
      if (userDoc.exists()) {
        currentUsername = userDoc.data().username;
        startChat();
      } else {
        document.getElementById("username-screen").style.display = "flex";
      }
    } else {
        document.getElementById("app").style.display = "none";
        document.getElementById("login-screen").style.display = "flex";
    }
  });

  // --- USERNAME CLAIM LOGIC ---
  document.getElementById("save-username-btn").onclick = async () => {
    const input = document.getElementById("username-input").value.trim().toLowerCase();
    if (input.length < 3) return alert("Name is too short!");
    if (input.length > 15) return alert("Name is too long!");

    try {
      await runTransaction(db, async (transaction) => {
        const nameRef = doc(db, "usernames", input);
        const nameSnap = await transaction.get(nameRef);

        if (nameSnap.exists()) {
          throw "This name is already taken!";
        }

        transaction.set(nameRef, { uid: currentUser.uid });
        transaction.set(doc(db, "users", currentUser.uid), { username: input });
      });

      currentUsername = input;
      document.getElementById("username-screen").style.display = "none";
      startChat();
    } catch (e) {
      alert(e);
    }
  };

  // --- CHAT LOGIC ---
  function startChat() {
    document.getElementById("app").style.display = "flex";
    
    const q = query(collection(db, "messages"), orderBy("time", "desc"), limit(50));
    
    if (unsubscribeChat) unsubscribeChat();

    unsubscribeChat = onSnapshot(q, s => {
      const container = document.getElementById("chat-container");
      const docs = [...s.docs].reverse();
      
      const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 100;

      container.innerHTML = docs.map(d => {
        const data = d.data();
        const isMe = data.uid === currentUser.uid;
        return `<div class="bubble ${isMe ? 'me' : ''}"><span class="name">${data.name}</span>${data.text}</div>`;
      }).join('');

      if (isAtBottom) {
        container.scrollTop = container.scrollHeight;
      }
    });
  }

  async function send() {
    const inp = document.getElementById("msg-input");
    const txt = inp.value.trim();
    if(!txt) return;
    inp.value = "";
    try {
        await addDoc(collection(db, "messages"), { 
          uid: currentUser.uid,
          name: currentUsername, 
          text: txt, 
          time: serverTimestamp() 
        });
    } catch (e) {
        console.error("Error sending message: ", e);
    }
  }

  document.getElementById("send-btn").onclick = send;
  document.getElementById("msg-input").onkeypress = e => { if(e.key === "Enter") send(); };
</script>
</body>
</html>
